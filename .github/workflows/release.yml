name: release

# Any tag v* publishes binaries for that tag. The launchers download the
# release named in VERSION, so point VERSION at a tag once it is released.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    needs: release
    if: ${{ always() && needs.release.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove failed release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release delete "$TAG" --yes || true
          gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
